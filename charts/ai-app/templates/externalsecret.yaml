{{- if .Values.secrets.useExternalSecret }}
# Vault (KV v2) → Kubernetes Secret. Team ki LiteLLM virtual key yahin se aati hai.
# useExternalSecret=false (Phase 4, ESO se pehle): Secret <app>-secrets haath se banao.
# Developer ko key kabhi dikhti nahi; platform team scripts/litellm-onboard-team.sh se Vault mein daalti hai.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ai-app.name" . }}-secrets
  labels: {{- include "ai-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: {{ include "ai-app.name" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: litellm_api_key
      remoteRef:
        key: {{ include "ai-app.vaultPath" . }}
        property: litellm_api_key
    - secretKey: ingest_token
      remoteRef:
        key: {{ include "ai-app.vaultPath" . }}
        property: ingest_token
{{- end }}
