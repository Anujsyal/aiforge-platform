{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ai-app.name" . }}
  labels:
    {{- include "ai-app.labels" . | nindent 4 }}
    release: kube-prometheus-stack   # Prometheus sirf is label wale ServiceMonitors uthata hai
spec:
  selector:
    matchLabels: {{- include "ai-app.selector" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
