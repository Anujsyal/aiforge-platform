# Local dev + CI eval gate. Cluster jaisa hi flow, bas LiteLLM ki jagah seedha Ollama ka /v1.
#   docker compose up -d --build
#   ./../../scripts/pull-models.sh   (pehli baar models download)
#   curl -X POST localhost:8080/ingest -H 'content-type: application/json' -d '{"bundled":true}'
#   curl -X POST localhost:8080/ask -H 'content-type: application/json' -d '{"question":"What is the default team budget?"}'
services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama-models}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ["6333:6333"]

  rag-app:
    build: .
    image: ${RAG_IMAGE:-aiforge/rag-app:local}
    ports: ["8080:8080"]
    environment:
      APP_NAME: rag-app-local
      TEAM: local
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_API_KEY: ollama          # Ollama key check nahi karta
      CHAT_MODEL: ${CHAT_MODEL:-llama3.2:1b}
      EMBED_MODEL: nomic-embed-text
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ci-docs
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  ollama-models: {}
