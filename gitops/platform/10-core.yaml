    namespace: crossplane-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.21.2
    helm:
      valuesObject:
        # k3s mein etcd/scheduler/controller-manager/kube-proxy ek hi binary mein hain, alag
        # endpoints nahi milte → in targets ko band karo warna permanent "target down" alerts
        kubeEtcd: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeProxy: { enabled: false }
        alertmanager:
          enabled: false      # alerting Project 2 mein dikha chuke; yahan RAM bachao
        prometheus:
          prometheusSpec:
            retention: 3d
            # Har namespace ke ServiceMonitor/PrometheusRule uthao (sirf release label wale nahi)
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests: { cpu: 200m, memory: 768Mi }
              limits: { memory: 1536Mi }
        grafana:
          admin:
            existingSecret: grafana-admin   # ESO Vault se banata hai (platform-config/secrets)
            userKey: admin-user
            passwordKey: admin-password
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              searchNamespace: ALL
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              url: http://loki-gateway.observability.svc.cluster.local
              access: proxy
          resources:
            requests: { cpu: 50m, memory: 192Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
