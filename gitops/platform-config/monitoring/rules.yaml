# Recording + alert rules. (Alertmanager is lab mein off hai; alerts Prometheus/Grafana UI mein dikhte hain.)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aiforge-rag
  namespace: monitoring
spec:
  groups:
    - name: aiforge-rag.recording
      rules:
        - record: aiforge:rag_requests:rate5m
          expr: sum by (namespace) (rate(rag_requests_total[5m]))
        - record: aiforge:rag_latency_p95:5m
          expr: histogram_quantile(0.95, sum by (le, namespace) (rate(rag_request_duration_seconds_bucket[5m])))
        - record: aiforge:llm_tokens:rate1h
          expr: sum by (namespace) (rate(rag_llm_tokens_total[1h]))
    - name: aiforge-rag.alerts
      rules:
        - alert: RagHighLatency
          expr: aiforge:rag_latency_p95:5m > 30
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.namespace }} p95 latency {{ $value | humanizeDuration }} (CPU model overloaded?)"
        - alert: RagGatewayErrors
          expr: sum by (namespace) (rate(rag_requests_total{status="error"}[5m])) / clamp_min(sum by (namespace) (rate(rag_requests_total[5m])), 1e-9) > 0.1
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.namespace }}: >10% /ask errors (LiteLLM down, Ollama OOM, ya budget khatam)"
        - alert: RagQualityDrop
          # Production mein "I don't know" achanak badha = retrieval toot gaya (collection khaali/galat embed model)
          expr: sum by (namespace) (rate(rag_unanswered_total[1h])) / clamp_min(sum by (namespace) (rate(rag_requests_total{status="ok"}[1h])), 1e-9) > 0.5
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.namespace }}: >50% answers are 'I don't know'"
