# Phase 8. Vault secret/platform/crossplane-aws → Secret aws-crossplane-creds (02-provider-configs.yaml use karta hai)
# Crossplane AWS provider ke credentials (INI format, provider yahi padhta hai)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-crossplane-creds
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: aws-crossplane-creds
    template:
      engineVersion: v2
      data:
        credentials: |
          [default]
          aws_access_key_id = {{ .id }}
          aws_secret_access_key = {{ .secret }}
  data:
    - { secretKey: id, remoteRef: { key: platform/crossplane-aws, property: access_key_id } }
    - { secretKey: secret, remoteRef: { key: platform/crossplane-aws, property: secret_access_key } }
