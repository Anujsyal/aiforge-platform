# ESO → Vault connection. Auth: Kubernetes auth method (ESO ka ServiceAccount token Vault verify karta hai).
# Vault side setup: scripts/vault-init.sh (kubernetes auth + "external-secrets" role + read-only policy)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret          # KV v2 mount
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
