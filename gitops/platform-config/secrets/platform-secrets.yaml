# Platform components ke secrets: Vault (secret/platform/*) → Kubernetes Secrets.
# Git mein sirf "kaunsa secret kahan se" likha hai, value kabhi nahi.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: ai-gateway
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: litellm-secrets
    template:
      engineVersion: v2
      data:
        LITELLM_MASTER_KEY: "{{ .master_key }}"
        LITELLM_SALT_KEY: "{{ .salt_key }}"
        POSTGRES_PASSWORD: "{{ .postgres_password }}"
        DATABASE_URL: "postgresql://litellm:{{ .postgres_password }}@litellm-postgres-0.litellm-postgres:5432/litellm"
        LANGFUSE_PUBLIC_KEY: "{{ .lf_public_key }}"
        LANGFUSE_SECRET_KEY: "{{ .lf_secret_key }}"
        LANGFUSE_HOST: "{{ .lf_host }}"
  data:
    - { secretKey: master_key, remoteRef: { key: platform/litellm, property: master_key } }
    - { secretKey: salt_key, remoteRef: { key: platform/litellm, property: salt_key } }
    - { secretKey: postgres_password, remoteRef: { key: platform/litellm, property: postgres_password } }
    - { secretKey: lf_public_key, remoteRef: { key: platform/langfuse, property: public_key } }
    - { secretKey: lf_secret_key, remoteRef: { key: platform/langfuse, property: secret_key } }
    - { secretKey: lf_host, remoteRef: { key: platform/langfuse, property: host } }
---
# OTel collector → Langfuse OTLP endpoint (Basic auth = base64(public:secret))
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-langfuse
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: otel-langfuse
    template:
      engineVersion: v2
      data:
        LANGFUSE_OTLP_ENDPOINT: "{{ .host }}/api/public/otel"
        LANGFUSE_AUTH: "{{ printf \"%s:%s\" .public_key .secret_key | b64enc }}"
  data:
    - { secretKey: host, remoteRef: { key: platform/langfuse, property: host } }
    - { secretKey: public_key, remoteRef: { key: platform/langfuse, property: public_key } }
    - { secretKey: secret_key, remoteRef: { key: platform/langfuse, property: secret_key } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: grafana-admin
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - { secretKey: password, remoteRef: { key: platform/grafana, property: admin_password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-secrets
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target:
    name: backstage-secrets
  data:
    - { secretKey: GITHUB_TOKEN, remoteRef: { key: platform/backstage, property: github_token } }
    - { secretKey: POSTGRES_PASSWORD, remoteRef: { key: platform/backstage, property: postgres_password } }
    - { secretKey: BACKEND_SECRET, remoteRef: { key: platform/backstage, property: backend_secret } }
# Crossplane AWS creds: gitops/platform-config/crossplane/00-aws-creds-externalsecret.yaml (Phase 8;
# crossplane-system namespace Crossplane install ke saath banta hai, yahan rakhte to secrets-config atak jaata)
