# Sirf jo default (charts/ai-app/values.yaml) se alag hai
llm:
  chatModel: llama3.2-1b
vectorStore:
  size: small
  rawDocsBucket: false
  create: false              # Phase 8 (Crossplane) mein hata
replicas: 1

# ---- Phase ke hisaab se temporary overrides ----
# image: CI release file (gitops/release/rag-app.yaml) se tag + digest aata hai (Phase 5 se)
# secrets: Vault secret/teams/team-alpha/team-alpha-rag → ESO → Secret (Phase 6 se, chart default)
serviceMonitor:
  enabled: false             # Phase 7 (Prometheus) mein hata
otel:
  enabled: false             # Phase 7 (OTel collector) mein hata
