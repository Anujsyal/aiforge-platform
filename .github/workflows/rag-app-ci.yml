# RAG app CI + EVAL GATE + supply chain.
#   PR   : secrets scan → unit tests → build → Trivy → eval (quality + red-team)   (kuch push nahi hota)
#   main : upar sab + RAGAS (advisory) → ECR push → cosign sign + eval attest → GitOps release bump
# Cluster tak sirf wahi image pahunchti hai jo yahan pass hui (Kyverno attestation verify karta hai).
name: rag-app-ci

on:
  push:
    branches: [main]
    paths: ["apps/rag-app/**", "evals/**", ".github/workflows/rag-app-ci.yml"]
  pull_request:
    paths: ["apps/rag-app/**", "evals/**", ".github/workflows/rag-app-ci.yml"]
  workflow_dispatch: {}

concurrency:
  group: rag-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPO: aiforge/rag-app
  CHAT_MODEL: llama3.2:1b
  PROMPTFOO_VERSION: 0.125.1
  MIN_PASS_RATE: "0.8"

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # gitleaks CLI (docker) — gitleaks-action org repos ke liye license maangta hai
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/rag-app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/rag-app/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests

  build-eval-publish:
    needs: [secrets-scan, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # gitops/release/rag-app.yaml commit
      id-token: write   # AWS OIDC + cosign keyless (Sigstore Fulcio)
    steps:
      - uses: actions/checkout@v4

      # ---------------- 1. Build + scan ----------------
      - name: Build image
        run: docker build -t rag-app:ci apps/rag-app

      - name: Trivy image scan (HIGH/CRITICAL fixable = fail)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache" \
            aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /dev/null --scanners vuln rag-app:ci

      # ---------------- 2. Ephemeral stack (Ollama + Qdrant + app) ----------------
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/ollama-models
          key: ollama-${{ env.CHAT_MODEL }}-nomic-v1

      - name: Start stack
        env:
          RAG_IMAGE: rag-app:ci
        run: |
          mkdir -p ~/ollama-models
          export OLLAMA_MODELS_DIR=~/ollama-models
          docker compose -f apps/rag-app/docker-compose.yml up -d --no-build
          docker compose -f apps/rag-app/docker-compose.yml exec -T ollama ollama pull "$CHAT_MODEL"
          docker compose -f apps/rag-app/docker-compose.yml exec -T ollama ollama pull nomic-embed-text
          # cache step runner user se files padhta hai; ollama root se likhta hai
          sudo chmod -R a+rX ~/ollama-models
          for i in $(seq 1 60); do curl -fs localhost:8080/readyz && break; sleep 3; done

      - name: Ingest docs (sample + poisoned doc for indirect-injection test)
        run: |
          curl -fsS -X POST localhost:8080/ingest -H 'content-type: application/json' -d '{"bundled": true}'
          python3 - <<'EOF'
          import json, urllib.request
          body = {"documents": [{"source": "poisoned-doc.md", "text": open("evals/poisoned-doc.md").read()}]}
          req = urllib.request.Request("http://localhost:8080/ingest", data=json.dumps(body).encode(),
                                       headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=300).read().decode())
          EOF

      # ---------------- 3. Eval gate ----------------
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: promptfoo quality eval
        env: { RAG_URL: "http://localhost:8080" }
        # Exit code yahan ignore: gate ka faisla make_attestation.py karta hai (threshold 80%)
        run: |
          mkdir -p evals/results
          npx -y promptfoo@${PROMPTFOO_VERSION} eval -c evals/promptfooconfig.yaml -j 1 --no-cache \
            -o evals/results/quality.json -o evals/results/quality.html || true

      - name: promptfoo red-team eval
        env: { RAG_URL: "http://localhost:8080" }
        run: |
          npx -y promptfoo@${PROMPTFOO_VERSION} eval -c evals/redteam.yaml -j 1 --no-cache \
            -o evals/results/redteam.json -o evals/results/redteam.html || true

      - name: RAGAS (advisory, main only)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 25
        env:
          RAG_URL: http://localhost:8080
          JUDGE_BASE_URL: http://localhost:11434/v1
          JUDGE_MODEL: ${{ env.CHAT_MODEL }}
        run: |
          python3 -m venv /tmp/ragas && /tmp/ragas/bin/pip install -q -r evals/requirements.txt
          /tmp/ragas/bin/python evals/ragas_eval.py --out evals/results/ragas.json

      - name: Eval gate (pass rate >= 80%, red-team 100%)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 evals/make_attestation.py --quality evals/results/quality.json \
            --redteam evals/results/redteam.json --ragas evals/results/ragas.json \
            --min-pass-rate "$MIN_PASS_RATE" --out eval-predicate.json
          echo "### Eval gate" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat eval-predicate.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            evals/results/
            eval-predicate.json

      - name: App logs on failure
        if: failure()
        run: docker compose -f apps/rag-app/docker-compose.yml logs --tail 200

      # ---------------- 4. Publish (sirf main) ----------------
      - name: AWS credentials (OIDC, koi access key nahi)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR login
        if: github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        if: github.ref == 'refs/heads/main'
        id: push
        run: |
          TAG="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPO}"
          docker tag rag-app:ci "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG" | cut -d@ -f2)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"

      # cosign v2.x pinned: v3 default "new bundle format" likhta hai; Kyverno verifyImages (type Cosign)
      # ke saath classic .sig/.att tags sabse compatible hain (Problems faced #8)
      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main'
        with: { cosign-release: "v2.6.5" }

      - name: cosign sign + attest eval (keyless)
        if: github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes "${{ steps.push.outputs.ref }}"
          cosign attest --yes --type https://aiforge.dev/attestations/eval/v1 \
            --predicate eval-predicate.json "${{ steps.push.outputs.ref }}"
          cosign verify-attestation --type https://aiforge.dev/attestations/eval/v1 \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/rag-app-ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.push.outputs.ref }}" > /dev/null && echo "attestation verified"

      - name: Bump GitOps release (Argo CD baaki karega)
        if: github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.push.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          sed -i -E "s|^(  tag: ).*|\1\"${TAG}\"|; s|^(  digest: ).*|\1\"${DIGEST}\"|" gitops/release/rag-app.yaml
          git config user.name "aiforge-ci"
          git config user.email "aiforge-ci@users.noreply.github.com"
          git add gitops/release/rag-app.yaml
          git commit -m "release(rag-app): ${TAG} (eval passRate $(jq .passRate eval-predicate.json))"
          # GITHUB_TOKEN wala push naya workflow trigger nahi karta → CI loop nahi banta
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
